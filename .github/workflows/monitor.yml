name: superdoc-monitor

# How this works: one run keeps checking every 10 minutes for about 5h45m,
# then starts the next run itself. The hourly cron below is only a safety net
# that restarts the chain if it ever stops. You start it once by hand.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # to save state.json
  actions: write    # to start the next run

concurrency:
  group: superdoc-monitor   # only one run at a time; the next waits its turn
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check every 10 minutes for about 5h45m
        env:
          FAIL_ON_ALERT: "1"   # a found slot = failed run = GitHub emails you right away
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}       # optional
          ALERT_BEFORE: ${{ secrets.ALERT_BEFORE }}   # optional
        run: |
          end=$((SECONDS + 20700))
          status=0
          while [ "$SECONDS" -lt "$end" ]; do
            if ! python superdoc_monitor.py; then
              status=1      # alert found (or crash): stop here so GitHub emails you now
              break
            fi
            sleep 600
          done
          exit $status

      - name: Save state
        if: success() || failure()
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          if [ -f state.json ]; then git add state.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            git pull --rebase -X theirs origin main
            git push
          fi

      - name: Start the next run
        if: success() || failure()   # skipped if you cancel the run, so cancelling stops the chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref "${GITHUB_REF_NAME}"
