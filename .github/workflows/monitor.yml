name: superdoc-monitor

on:
  schedule:
    - cron: "*/10 * * * *"   # every 30 minutes
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to commit state.json back

concurrency:
  group: superdoc-monitor     # never run two checks at the same time
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check for earlier slots
        run: python superdoc_monitor.py
        env:
          FAIL_ON_ALERT: "1"   # a found slot = "failed run" = GitHub emails you
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}       # optional
          ALERT_BEFORE: ${{ secrets.ALERT_BEFORE }}   # optional

      - name: Save state
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          if [ -f state.json ]; then git add state.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            git pull --rebase -X theirs origin main
            git push
          fi
